[project]
name = "emacsos-server"
version = "0.2.0"
description = "HTTP gateway between the phone and the assist agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2",
    "requests>=2.28",  # sms_forward daemon (inbound POST to assist)
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24",
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["emacsos_server*"]

# Ship the skill files (SKILL.md under emacsos_server/skills/) in a
# wheel/sdist, not just under an editable install — the config-apply skill
# backend reads them at runtime.
[tool.setuptools.package-data]
emacsos_server = ["skills/**/*.md"]
