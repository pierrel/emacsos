[pmbootstrap]
build_default_device_arch = False
ccache_size = 5G
device = pine64-pinephone
extra_packages = none
hostname = pine64-pinephone
is_default_channel = False
jobs = 8
locale = en_US.UTF-8
ssh_key_glob = ~/.ssh/id_ed25519.pub
ssh_keys = True
sudo_timer = False
# pmbootstrap 3.11+; older 3.5 uses the systemd compatibility key below.
service_manager = openrc
systemd = never
timezone = America/Los_Angeles
ui = console
work = /work/work

[providers]

[mirrors]
