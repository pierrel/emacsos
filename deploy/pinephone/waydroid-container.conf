<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <!-- The upstream package permits every local user to call the root
         container manager.  This image has one locked Android/UI account. -->
    <policy context="default">
        <deny send_destination="id.waydro.Container"/>
    </policy>
    <policy user="root">
        <allow send_destination="id.waydro.Container"/>
    </policy>
    <policy user="emacsos-lab">
        <allow send_destination="id.waydro.Container"/>
    </policy>
</busconfig>
